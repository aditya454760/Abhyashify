/* ---------- custom voices: a cloned voice (online) and a trained voice pack (offline) ----------
   Order when the assistant speaks: a saved clip of the cloned voice -> the cloned voice (online) -> the offline voice pack
   -> the device's own voice. Each sentence is tried on its own, so a failure never silences the assistant. */
const CV_API='https://api.elevenlabs.io/v1';
ACFG.cv=ACFG.cv||{};if(typeof ACFG.elKey!=='string')ACFG.elKey='';if(!ACFG.elModel)ACFG.elModel='eleven_multilingual_v2';
let CV_AUDIO=null,CV_STATUS='',CV_TOLD=false;
const CVUI={consent:false,label:'',busy:'',msg:''};
const cvCfg=g=>(ACFG.cv&&ACFG.cv[g||ACFG.gender])||{};
const cvSave=(g,p)=>{ACFG.cv=ACFG.cv||{};ACFG.cv[g]=Object.assign({},ACFG.cv[g]||{},p);saveAcfg()};
const cvPackMeta=(g,l)=>{const c=cvCfg(g);return c.pack&&c.pack[l||LANG]||null};
const cvUsable=g=>{const c=cvCfg(g);return (c.on!==false&&!!c.voiceId)||(c.packOn!==false&&!!cvPackMeta(g))};

/* small storage for saved clips and voice packs (IndexedDB, with a memory fallback when it is blocked) */
const CVDB=(()=>{
  const mem={clips:new Map(),packs:new Map()};let dbp=null,idx=null,puts=0;
  const open=()=>dbp||(dbp=new Promise(res=>{try{const q=indexedDB.open('abhyashify-voice',1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('clips');d.createObjectStore('packs')};q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);q.onblocked=()=>res(null)}catch(e){res(null)}}));
  const req=(store,mode,f)=>open().then(d=>d?new Promise(res=>{try{const t=d.transaction(store,mode);const r=f(t.objectStore(store));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>res(undefined);t.onabort=()=>res(undefined)}catch(e){res(undefined)}}):null);
  const api={
    async get(s,k){const r=await req(s,'readonly',o=>o.get(k));return r===null?mem[s].get(k):r},
    async put(s,k,v){const r=await req(s,'readwrite',o=>o.put(v,k));if(r===null)mem[s].set(k,v)},
    async del(s,k){const r=await req(s,'readwrite',o=>o.delete(k));if(r===null)mem[s].delete(k)},
    async keys(s){const r=await req(s,'readonly',o=>o.getAllKeys());return r===null?[...mem[s].keys()]:(r||[])},
    async clear(s){const r=await req(s,'readwrite',o=>o.clear());if(r===null)mem[s].clear()},
    async stamp(key){ // remember when a clip was last used, and drop the oldest ones past 400
      if(!idx)idx=(await api.get('packs','\u0000clip-index'))||{};
      idx[key]=Date.now();
      if(++puts%10===0||Object.keys(idx).length>400){
        const ks=Object.keys(idx);
        if(ks.length>400){ks.sort((a,b)=>idx[a]-idx[b]).slice(0,ks.length-360).forEach(k=>{delete idx[k];api.del('clips',k)})}
        api.put('packs','\u0000clip-index',idx);
      }
    }
  };
  return api;
})();

/* ---- why the cloned voice could not be used, in plain words ---- */
function cvFail(e){
  const s=e&&e.status;
  CV_STATUS=s==='nokey'?H('No ElevenLabs key is saved.','ElevenLabs की key सेव नहीं है।')
    :s==='offline'||(e&&e.name==='TypeError')?H('No internet, so I used a saved or device voice.','इंटरनेट नहीं है, इसलिए मैंने सेव की हुई या डिवाइस की आवाज़ इस्तेमाल की।')
    :s===401?H('ElevenLabs rejected the key.','ElevenLabs ने key स्वीकार नहीं की।')
    :s===402||s===429||s===403?H('The ElevenLabs quota or plan does not allow this right now.','ElevenLabs का कोटा या प्लान अभी इसकी अनुमति नहीं देता।')
    :s===404?H('That cloned voice no longer exists on ElevenLabs.','वह क्लोन की हुई आवाज़ अब ElevenLabs पर नहीं है।')
    :H('The cloned voice did not respond ('+(s||'error')+').','क्लोन की हुई आवाज़ ने जवाब नहीं दिया ('+(s||'error')+')।');
  if(!CV_TOLD){CV_TOLD=true;try{toast(CV_STATUS)}catch(x){}}
  cvRepaint();
}
function cvRepaint(){const c=document.getElementById('as-cfg');if(c&&typeof cfgHtml==='function'){const keep=document.activeElement&&document.activeElement.id;c.innerHTML=cfgHtml();if(keep){const el=document.getElementById(keep);if(el)try{el.focus()}catch(e){}}}}

/* ---- ElevenLabs ---- */
async function cvFetchEl(text,c){
  const r=await fetch(CV_API+'/text-to-speech/'+encodeURIComponent(c.voiceId)+'?output_format=mp3_44100_64',{method:'POST',headers:{'xi-api-key':ACFG.elKey,'Content-Type':'application/json',Accept:'audio/mpeg'},
    body:JSON.stringify({text,model_id:ACFG.elModel||'eleven_multilingual_v2',voice_settings:{stability:.5,similarity_boost:.8}})});
  if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e}
  return {buf:await r.arrayBuffer(),mime:'audio/mpeg'};
}
async function cvClip(text,c,g){
  const key=[g,c.voiceId||'',ACFG.elModel||'',text].join('|');
  if(c.voiceId){
    const hit=await CVDB.get('clips',key);
    if(hit&&hit.buf){CVDB.stamp(key);return hit}
    if(!ACFG.elKey){cvFail({status:'nokey'});return null}
    if(navigator.onLine===false){cvFail({status:'offline'});return null}
    try{const o=await cvFetchEl(text,c);o.t=Date.now();await CVDB.put('clips',key,o);CVDB.stamp(key);CV_STATUS='';return o}
    catch(e){cvFail(e)}
  }
  return null;
}

/* ---- playing audio ---- */
const cvPlayReal=(buf,mime,rate)=>new Promise(res=>{
  try{
    const url=URL.createObjectURL(new Blob([buf],{type:mime||'audio/mpeg'})),a=new Audio(url);CV_AUDIO=a;a.playbackRate=rate||1;
    const end=()=>{try{URL.revokeObjectURL(url)}catch(e){}if(CV_AUDIO===a)CV_AUDIO=null;res()};a._end=end;a.onended=end;a.onerror=end;
    const p=a.play();if(p&&p.catch)p.catch(end);
  }catch(e){res()}
});
const cvPlay=(buf,mime,rate)=>(window.CV_PLAY||cvPlayReal)(buf,mime,rate);
function cvStopAudio(){try{if(CV_AUDIO){const a=CV_AUDIO;CV_AUDIO=null;a.pause();a._end&&a._end()}}catch(e){}}

function speakDeviceOne(p){
  return new Promise(res=>{
    if(!SYN_||!window.SpeechSynthesisUtterance){res();return}
    const pv=pickVoice(),u=new SpeechSynthesisUtterance(String(p).trim());
    if(pv.v){u.voice=pv.v;u.lang=pv.v.lang}else u.lang=ACFG.lang;
    u.rate=Math.min(1.6,Math.max(.6,+ACFG.rate||1));u.pitch=pv.pitch;u.onend=u.onerror=()=>res();
    try{SYN_.speak(u)}catch(e){res()}
  });
}
async function speakCustom(parts,gen,done,c,g){
  parts=parts.map(p=>p.trim()).filter(Boolean);
  const jobs=[],job=i=>i<parts.length?(jobs[i]||(jobs[i]=cvClip(parts[i],c,g))):null;
  speakingNow=true;paintMic();
  for(let i=0;i<parts.length;i++){
    let o=null;
    if(c.voiceId&&c.on!==false){job(i);job(i+1);o=await job(i);if(gen!==speakGen)return}
    if(!o&&window.CVPack&&cvCfg(g).packOn!==false&&cvPackMeta(g)){try{o=await window.CVPack.synth(parts[i],g,LANG)}catch(e){o=null}if(gen!==speakGen)return}
    if(o)await cvPlay(o.buf,o.mime,+ACFG.rate||1);else await speakDeviceOne(parts[i]);
    if(gen!==speakGen)return;
  }
  speakingNow=false;paintMic();done&&done();
}

/* ---- making and removing a cloned voice ---- */
async function cvCreate(files){
  const g=ACFG.gender;
  const say=m=>{CVUI.busy='';CVUI.msg=m;cvRepaint()};
  if(!CVUI.consent)return say(H('Please confirm that the person agreed to this first.','पहले पुष्टि करें कि उस व्यक्ति ने इसके लिए हामी भरी है।'));
  if(!ACFG.elKey)return say(H('Paste your ElevenLabs key first.','पहले अपनी ElevenLabs key चिपकाएँ।'));
  if(!files.length)return say(H('Choose one or more recordings of that person speaking.','उस व्यक्ति की बोलती हुई एक या ज़्यादा रिकॉर्डिंग चुनें।'));
  if(files.length>5||files.some(f=>f.size>10*1048576))return say(H('Use up to 5 recordings, each under 10 MB.','ज़्यादा से ज़्यादा 5 रिकॉर्डिंग लें, हर एक 10 MB से छोटी।'));
  CVUI.busy=H('Creating the voice…','आवाज़ बन रही है…');CVUI.msg='';cvRepaint();
  const fd=new FormData();fd.append('name','Abhyashify '+(CVUI.label||asstName()));fd.append('description','Voice for the Abhyashify study assistant, used with the speaker\'s permission.');files.forEach(f=>fd.append('files',f,f.name||'voice.wav'));
  try{
    const r=await fetch(CV_API+'/voices/add',{method:'POST',headers:{'xi-api-key':ACFG.elKey},body:fd});
    if(!r.ok){
      const s=r.status;
      return say(s===401?H('ElevenLabs rejected the key.','ElevenLabs ने key स्वीकार नहीं की।'):s===402||s===403?H('Cloning a voice needs a paid ElevenLabs plan, or your plan has no voice slots left.','आवाज़ क्लोन करने के लिए ElevenLabs का पेड प्लान चाहिए, या आपके प्लान में आवाज़ की जगह नहीं बची।'):s===422?H('ElevenLabs could not use those recordings. Try clear speech without background noise.','ElevenLabs उन रिकॉर्डिंग का इस्तेमाल नहीं कर सका। बिना शोर की साफ़ आवाज़ आज़माएँ।'):H('ElevenLabs returned an error ('+s+').','ElevenLabs से गड़बड़ी आई ('+s+')।'));
    }
    const j=await r.json();
    if(!j||!j.voice_id)return say(H('ElevenLabs did not return a voice.','ElevenLabs ने कोई आवाज़ नहीं लौटाई।'));
    cvSave(g,{voiceId:j.voice_id,label:CVUI.label.trim(),consentAt:Date.now(),on:true});
    CVUI.consent=false;CVUI.label='';CV_STATUS='';CV_TOLD=false;
    say(H('Voice created. Tap "Test the voice" to hear it.','आवाज़ बन गई। सुनने के लिए "आवाज़ सुनकर देखें" दबाएँ।'));
  }catch(e){say(H('Could not reach ElevenLabs. Check your internet.','ElevenLabs तक नहीं पहुँच सका। इंटरनेट जाँचें।'))}
}
async function cvRemove(){
  const g=ACFG.gender,c=cvCfg(g);let warn='';
  if(c.voiceId&&ACFG.elKey){try{const r=await fetch(CV_API+'/voices/'+encodeURIComponent(c.voiceId),{method:'DELETE',headers:{'xi-api-key':ACFG.elKey}});if(!r.ok&&r.status!==404)warn=H(' It could not be deleted on ElevenLabs, so remove it there yourself.',' ElevenLabs से हटाया नहीं जा सका, इसे वहाँ ख़ुद हटा दें।')}catch(e){warn=H(' It could not be deleted on ElevenLabs (no connection), so remove it there yourself.',' ElevenLabs से हटाया नहीं जा सका (कनेक्शन नहीं), इसे वहाँ ख़ुद हटा दें।')}}
  else if(c.voiceId)warn=H(' Remove it on elevenlabs.io too.',' elevenlabs.io से भी हटा दें।');
  const keys=await CVDB.keys('clips');for(const k of keys)if(String(k).startsWith(g+'|'+(c.voiceId||'\u0001')+'|'))await CVDB.del('clips',k);

/* ---------- offline voice packs: a trained Piper-style voice that runs inside the browser ----------
   A pack is two files made by training: voice.onnx and voice.onnx.json. They are stored on this device (IndexedDB)
   and run in a worker with ONNX Runtime Web and eSpeak NG, both served from this site, so nothing needs the internet. */
const CVPack=(()=>{
  let worker=null,seq=0,idle=null;const pend=new Map(),loaded=new Set();
  const LANGS=[['en','English'],['hi','हिन्दी']];
  const wk=()=>{
    if(worker)return worker;
    worker=new Worker(new URL('voice/runtime/worker.mjs',document.baseURI),{type:'module'});
    worker.onmessage=e=>{const m=e.data,p=pend.get(m.id);if(!p)return;pend.delete(m.id);m.error?p.rej(new Error(m.error)):p.res(m)};
    worker.onerror=e=>{pend.forEach(p=>p.rej(new Error(e.message||'worker error')));pend.clear();try{worker.terminate()}catch(x){}worker=null;loaded.clear()};
    return worker;
  };
  const call=(msg,transfer)=>new Promise((res,rej)=>{
    const id=++seq;pend.set(id,{res,rej});
    try{wk().postMessage(Object.assign({id},msg),transfer||[])}catch(e){pend.delete(id);rej(e)}
    clearTimeout(idle);idle=setTimeout(()=>{if(!pend.size&&worker){try{worker.terminate()}catch(e){}worker=null;loaded.clear()}},90000);
  });
  function pcmToWav(pcm,rate){
    let mx=.01;for(let i=0;i<pcm.length;i++){const a=Math.abs(pcm[i]);if(a>mx)mx=a}
    const k=32767/mx,n=pcm.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-32768,Math.min(32767,Math.round(pcm[i]*k))),true);
    return b;
  }
  async function ensure(g,lang,meta){
    const key=g+'|'+lang+'|'+meta.t;
    if(loaded.has(key))return key;
    const rec=await CVDB.get('packs',g+'|'+lang);
    if(!rec||!rec.model)throw new Error('missing');
    const copy=rec.model.slice(0);
    await call({type:'load',key,model:copy,config:rec.config},[copy]);
    loaded.add(key);return key;
  }
  async function synth(text,g,lang){
    const meta=cvPackMeta(g,lang);if(!meta)return null;
    try{
      const key=await ensure(g,lang,meta);
      const r=await call({type:'synth',key,text});
      if(!r.pcm||!r.pcm.length)return null;
      return {buf:pcmToWav(r.pcm,r.rate),mime:'audio/wav'};
    }catch(e){
      CV_STATUS=H('The offline voice could not run ('+(e.message||'error')+'), so I used the device voice.','ऑफ़लाइन आवाज़ चल नहीं सकी ('+(e.message||'error')+'), इसलिए मैंने डिवाइस की आवाज़ इस्तेमाल की।');
      cvRepaint();return null;
    }
  }
  const mb=n=>(n/1048576).toFixed(n>10485760?0:1)+' MB';
  async function add(g,lang,files){
    const say=m=>{CVUI.busy='';CVUI.msg=m;cvRepaint()};
    if(!CVUI.packOk)return say(H('Please tick the box that says you may use this voice.','पहले वह बॉक्स चुनें जो कहता है कि आप इस आवाज़ का इस्तेमाल कर सकते हैं।'));
    const onnx=files.find(f=>/\.onnx$/i.test(f.name)),js=files.find(f=>/\.json$/i.test(f.name));
    if(!onnx||!js)return say(H('Choose both files: the .onnx file and the .onnx.json file.','दोनों फ़ाइलें चुनें: .onnx और .onnx.json।'));
    if(onnx.size>250*1048576)return say(H('That model is over 250 MB. Use a "medium" or "low" quality voice.','वह मॉडल 250 MB से बड़ा है। "medium" या "low" क्वालिटी की आवाज़ लें।'));
    let cfg;try{cfg=JSON.parse(await js.text())}catch(e){return say(H('The .json file is not valid.','.json फ़ाइल सही नहीं है।'))}
    if(!cfg||!cfg.phoneme_id_map||!cfg.audio||!cfg.audio.sample_rate)return say(H('That does not look like a Piper voice config.','यह Piper आवाज़ का कॉन्फ़िग नहीं लगता।'));
    if(cfg.phoneme_type&&cfg.phoneme_type!=='espeak')return say(H('Only voices that use eSpeak phonemes are supported.','सिर्फ़ वही आवाज़ें चलती हैं जो eSpeak फ़ोनीम इस्तेमाल करती हैं।'));
    CVUI.busy=H('Checking the voice…','आवाज़ जाँची जा रही है…');CVUI.msg='';cvRepaint();
    const model=await onnx.arrayBuffer(),t=Date.now(),key=g+'|'+lang+'|'+t,copy=model.slice(0);
    try{await call({type:'load',key,model:copy,config:cfg},[copy]);loaded.add(key);
      const probe=await call({type:'synth',key,text:lang==='hi'?'नमस्ते':'hello'});
      if(!probe.pcm||!probe.pcm.length)throw new Error('no audio');
    }catch(e){return say(H('That voice could not be loaded ('+(e.message||'error')+').','वह आवाज़ लोड नहीं हो सकी ('+(e.message||'error')+')।'))}
    await CVDB.put('packs',g+'|'+lang,{model,config:cfg,name:CVUI.label||onnx.name.replace(/\.onnx$/i,''),t});
    const c=cvCfg(g),pack=Object.assign({},c.pack||{});
    pack[lang]={name:(CVUI.label||onnx.name.replace(/\.onnx$/i,'')).trim(),size:onnx.size,sr:cfg.audio.sample_rate,voice:(cfg.espeak&&cfg.espeak.voice)||'',t};
    cvSave(g,{pack,packOn:true});CVUI.packOk=false;
    say(H('Offline voice added. It works without internet.','ऑफ़लाइन आवाज़ जुड़ गई। यह बिना इंटरनेट चलती है।'));
  }
  async function remove(g,lang){
    await CVDB.del('packs',g+'|'+lang);
    const c=cvCfg(g),pack=Object.assign({},c.pack||{});const m=pack[lang];delete pack[lang];
    if(m){try{await call({type:'drop',key:g+'|'+lang+'|'+m.t});loaded.delete(g+'|'+lang+'|'+m.t)}catch(e){}}
    cvSave(g,{pack});CVUI.msg=H('Offline voice removed from this device.','ऑफ़लाइन आवाज़ इस डिवाइस से हटा दी गई।');cvRepaint();
  }
  function html(g){
    const c=cvCfg(g),who=g==='male'?H('Adi','आदि'):H('Anu','अनु');
    const dis=CVUI.busy?' disabled':'';
    return `<div class="stack" style="gap:8px;margin-top:8px"><span class="kick">${H('Offline voice pack for '+who,'ऑफ़लाइन वॉइस पैक: '+who)}</span>
      <p class="small muted">${H('A voice trained for '+who+' that runs on this device with no internet. Add one per language. You need two files for each: voice.onnx and voice.onnx.json (see the voice kit in the project).','एक प्रशिक्षित आवाज़ जो इस डिवाइस पर बिना इंटरनेट चलती है। हर भाषा के लिए एक जोड़ें। हर एक के लिए दो फ़ाइलें चाहिए: voice.onnx और voice.onnx.json (प्रोजेक्ट का वॉइस किट देखें)।')}</p>
      <label class="switch"><span>${H('I may use this voice (it is mine, its owner agreed, or its licence allows it)','मैं इस आवाज़ का इस्तेमाल कर सकता/सकती हूँ (यह मेरी है, मालिक ने हामी भरी है, या लाइसेंस इजाज़त देता है)')}</span><input type="checkbox" data-cv="packok"${CVUI.packOk?' checked':''}></label>
      ${LANGS.map(([l,nm])=>{const m=c.pack&&c.pack[l];return m
        ?`<div class="small"><b translate="no">${nm}</b> · <span translate="no">${esc(m.name)}</span> · ${mb(m.size)} <button type="button" class="btn ghost danger" data-cv-act="packrm" data-lang="${l}"${dis}>${H('Remove','हटाएँ')}</button></div>`
        :`<label class="field"><span translate="no">${nm}</span><input type="file" id="cvp-${l}" accept=".onnx,.json,application/json" multiple></label><button type="button" class="btn ghost" data-cv-act="packadd" data-lang="${l}"${dis}>${H('Add the '+(l==='hi'?'Hindi':'English')+' voice',(l==='hi'?'हिन्दी':'अंग्रेज़ी')+' आवाज़ जोड़ें')}</button>`}).join('')}
      ${c.pack&&Object.keys(c.pack).length?`<label class="switch"><span>${H('Use the offline voice when the cloned voice is not available','क्लोन आवाज़ न मिलने पर ऑफ़लाइन आवाज़ इस्तेमाल करें')}</span><input type="checkbox" data-cv="packon"${c.packOn!==false?' checked':''}></label>`:''}</div>`;
  }
  return {synth,html,add,remove,has:(g,l)=>!!cvPackMeta(g,l),pcmToWav};
})();

function csvQ(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function calendarCsv(){
  const rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Private']];
  const t12=m=>{const h=Math.floor(m/60)%24,mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h<12?'AM':'PM')};
  const us=d=>pad(d.getMonth()+1)+'/'+pad(d.getDate())+'/'+d.getFullYear();
  const start=new Date(),end=S.plan.exam?parseYmd(S.plan.exam):addDays(start,90);
  for(let d=new Date(start.getFullYear(),start.getMonth(),start.getDate());d<=end&&rows.length<600;d=addDays(d,1)){
    for(const b of blocksOn(S.plan,d)){
      const s=toMin(b.st),e=s+b.m;
      rows.push([blockTitle(b),us(d),t12(s),us(d),t12(e),'False',b.sh?`${b.sh} practice sheet(s)`:'','True']);
    }
  }
  return rows.map(r=>r.map(csvQ).join(',')).join('\n');
}

function tickTimer(){
  if(!run)return;
  const s=Math.floor((Date.now()-run.t0)/1000),txt=pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);
  for(const id of ['clock','mclock']){const el=document.getElementById(id);if(el)el.textContent=txt}
}
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<3;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+i*.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)}
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}

function ring(b,late){
  const el=document.getElementById('alarm');
  el.innerHTML=`<div class="alarm-card" role="alertdialog" aria-label="Study alarm"><span class="alarm-ring">${ic('bell')}</span><span class="kick">${late?'Missed alarm':'Time to study'}</span><h2>${esc(blockTitle(b))}</h2><div class="big">${b.st}</div><p class="muted">${fmtDur(b.m)}${b.sh?' · '+sheetsLabel(b.sh):''}</p>
    <button class="btn lg" type="button" data-act="alarmstart" data-b="${b.id}">${ic('play')}Start now</button>
    <div class="grid2" style="width:100%"><button class="btn ghost" type="button" data-act="snooze" data-b="${b.id}">Snooze 5 min</button><button class="btn ghost" type="button" data-act="dismiss">Dismiss</button></div></div>`;
  el.hidden=false;beep();clearInterval(ringTimer);let n=0;ringTimer=setInterval(()=>{if(++n>40)return stopRing();beep()},2200);
  notify(H(late?'Missed alarm':'Time to study',late?'छूटा हुआ अलार्म':'पढ़ने का समय')+': '+L(blockTitle(b)),b.st+' · '+FD(b.m),'b|'+b.id);
}
function stopRing(){clearInterval(ringTimer);document.getElementById('alarm').hidden=true}
function alarmTick(){
  tickTimer();extraAlarms();finishToolRun();
  const now=new Date(),ds=ymd(now),nm=now.getHours()*60+now.getMinutes();
  for(const b of blocksOn(S.plan,now)){
    if(!b.al)continue;
    const key=ds+'|'+b.id,at=toMin(b.st)-(S.plan.lead||0);
    const sz=snoozes[key];
    if(sz){if(Date.now()>=sz){delete snoozes[key];ring(b,false)}continue}
    if(fired[key])continue;
    if(nm>=at&&nm<=at+5&&armed&&document.getElementById('alarm').hidden){fired[key]=1;lsSet('pl.fired',fired);ring(b,nm>at+1)}
  }
}

    case 'settings':settingsForm();break;
    case 'lang':setLang(d.v);break;
    case 'lookacc':{const r=setLook({accent:d.v||null});if(r.err)toast(r.err);paintLookPickers();break}
    case 'lookbg':{const r=setLook({bg:d.v||null});if(r.err)toast(r.err);else if(r.note)toast(r.note.trim());paintLookPickers();document.querySelectorAll('#themeseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===theme));break}
    case 'theme':theme=d.v;lsSet('pl.theme',theme);applyTheme();document.querySelectorAll('#themeseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===theme));break;
    case 'exportcsv':saveFile('prep-schedule.csv',calendarCsv(),'text/csv');break;
    case 'exportjson':saveFile('abhyashify-backup.json',JSON.stringify(backupData(),null,1),'application/json');break;
    case 'arm':
      if(!armed){armed=true;beep();keepAwake();toast('Alarms on. Keep this page open.')}
      else{armed=false;try{wakeLock&&wakeLock.release()}catch(err){}wakeLock=null;toast('Alarms off')}
      paintHeader();if(tab==='today')render(false);break;
    case 'testsound':beep();break;
    case 'alarmstart':stopRing();startRun(d.b);break;
    case 'snooze':snoozes[ymd(new Date())+'|'+d.b]=Date.now()+5*60000;stopRing();toast('Snoozed for 5 minutes');break;
    case 'dismiss':stopRing();break;
    case 'install':await installApp();break;
    case 'installhelp':installHelp();break;
    case 'installno':lsSet('pl.instno','1');render(false);break;
    case 'signin':await signIn();break;
    case 'local':lsSet('pl.mode','local');enterLocal();break;
    case 'acct':accountSheet();break;
    case 'course':if(d.c!==CL.cid){closeSheet();await openCourse(d.c)}else closeSheet();break;
    case 'newcourse':courseForm();break;
    case 'importjson':{const f=document.getElementById('impf');if(f)f.click();break}
    case 'signout':await signOutNow();break;
    case 'delcourse':
      if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Tap again to delete everything in this course';break}
      t.disabled=true;
      try{await deleteCourseData();closeSheet();toast('Course deleted')}catch(err){console.error(err);t.disabled=false;toast('Could not delete: '+(err&&err.code||'error'))}
      break;
  }
});
document.addEventListener('change',e=>{
  const f=e.target;
  if(f&&f.id==='impf'&&f.files&&f.files[0]){
    const file=f.files[0];f.value='';
    if(file.size>5e6){toast('That file is too large for a backup.');return}
    const r=new FileReader();
    r.onload=()=>{try{importBackup(JSON.parse(String(r.result)))}catch(err){toast('That file is not a Abhyashify backup.')}};
    r.readAsText(file);
  }
});

/* ---------- account, backup, import ---------- */
function backupData(){return {app:'abhyashify',version:2,course:CL?CL.name:null,plan:S.plan,materials:S.materials.map(m=>({id:m.id,title:m.title,subj:m.subj,kind:m.kind,unit:m.unit,total:m.total,done:m.done,file:m.file||null})),logs:S.logs}}
function importBackup(o){
  if(!o||typeof o!=='object'||!o.plan||!Array.isArray(o.materials)||!Array.isArray(o.logs))throw new Error('bad');
  let addedM=0,addedL=0;
  if(!S.plan.subjects.length&&!S.plan.blocks.length){S.plan=Object.assign(defaultPlan(),{exam:o.plan.exam||'',examName:o.plan.examName||'',buffer:+o.plan.buffer||21,lead:+o.plan.lead||5,
    subjects:(o.plan.subjects||[]).slice(0,60),blocks:(o.plan.blocks||[]).slice(0,300)});mark('plan')}
  const haveM=new Set(S.materials.map(m=>m.id)),haveL=new Set(S.logs.map(l=>l.id));
  for(const m of o.materials){if(!m||!m.id||haveM.has(m.id)||!m.title)continue;
    S.materials.push({id:String(m.id),title:String(m.title).slice(0,160),subj:m.subj||null,kind:m.kind||'theory',unit:m.unit||'pages',total:Math.max(0,+m.total||0),done:Math.max(0,+m.done||0),file:/^https?:\/\//i.test(m.file||'')?m.file:null,asset:null});addedM++}
  for(const l of o.logs){if(!l||!l.id||haveL.has(l.id)||!l.d||!l.st)continue;
    const x=ensureT({id:String(l.id),d:l.d,st:l.st,m:Math.min(720,Math.max(1,+l.m||1)),b:l.b||null,s:l.s||null,ps:l.ps||null,pm:l.pm||null,q:+l.q||0,mid:l.mid||null,mu:+l.mu||0,t0:+l.t0||0,t1:+l.t1||0,dev:l.dev||deviceId(),src:l.src||'manual',tz:l.tz==null?tzOff():l.tz,tool:l.tool||null});
    if(!(x.t0>0))continue;x.t1=x.t0+x.m*60000;S.logs.push(x);addedL++}
  if(addedM)mark('materials');if(addedL)mark('logs');
  closeSheet();render(false);toast(`Imported ${addedM} materials and ${addedL} sessions`);
}
function courseForm(){closeSheet(true);openWizard({ctx:'newcourse'})}
function emptyCourseForm(){
  openSheet('New course',`<label class="field">Course name<input type="text" name="n" maxlength="80" placeholder="My course" required></label><button class="btn lg" type="submit">Create course</button>`,async fd=>{
    const name=need((fd.get('n')||'').trim(),'Enter a name.');
    const id=await createCourse(name);CL.courses.push({id,name});closeSheet();await openCourse(id);toast('Course created');
  });
}
/* ---------- install as an app ---------- */
let installEv=null;
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installBtn(){
  if(isStandalone())return '';
  return installEv
    ?`<button class="btn lg soft" type="button" data-act="install">${ic('upload')}Install Abhyashify as an app</button>`
    :`<button class="btn lg soft" type="button" data-act="installhelp">${ic('upload')}How to install as an app</button>`;
}
function installCard(){
  if(isStandalone()||lsGet('pl.instno',null)==='1')return '';
  return `<div class="card" style="gap:10px"><div class="stack"><h2>Install Abhyashify</h2>
    <p class="muted">Add it to your home screen or desktop so it opens like a normal app, in its own window, and works offline.</p></div>
    ${installEv?`<button class="btn lg" type="button" data-act="install">Install now</button>`:`<button class="btn lg" type="button" data-act="installhelp">Show me how</button>`}
    <button class="btn ghost" type="button" data-act="installno">Not now</button></div>`;
}
function installHelp(){
  const ua=navigator.userAgent;
  const inApp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|GSA\//i.test(ua);
  let steps;
  if(isIOS())steps=H(`<li>Open this page in <b>Safari</b> (not inside another app).</li><li>Tap the <b>Share</b> button.</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>`,`<li>इस पेज को <b>Safari</b> में खोलें (किसी दूसरे ऐप के अंदर नहीं)।</li><li><b>Share</b> बटन दबाएँ।</li><li><b>Add to Home Screen</b> चुनें, फिर <b>Add</b> दबाएँ।</li>`);
  else if(/android/i.test(ua))steps=H(`<li>Open this page in <b>Chrome</b>.</li><li>Tap the <b>three dots</b> menu at the top right.</li><li>Tap <b>Install app</b> (some phones say <b>Add to Home screen</b>), then <b>Install</b>.</li>`,`<li>इस पेज को <b>Chrome</b> में खोलें।</li><li>ऊपर दाएँ कोने में <b>तीन बिंदुओं</b> वाला मेन्यू दबाएँ।</li><li><b>Install app</b> दबाएँ (कुछ फ़ोन में <b>Add to Home screen</b> लिखा होता है), फिर <b>Install</b> दबाएँ।</li>`);
  else steps=H(`<li>Use <b>Chrome</b> or <b>Edge</b>.</li><li>Click the <b>install icon</b> at the right end of the address bar (a small monitor with a down arrow).</li><li>If you don't see it, open the browser menu and look for <b>Install Abhyashify</b> (Chrome: Cast, save and share, then Install page as app).</li><li>Click <b>Install</b>.</li>`,`<li><b>Chrome</b> या <b>Edge</b> इस्तेमाल करें।</li><li>एड्रेस बार के दाएँ सिरे पर <b>इंस्टॉल आइकन</b> दबाएँ (नीचे तीर वाला छोटा मॉनिटर)।</li><li>अगर वह न दिखे, तो ब्राउज़र का मेन्यू खोलकर <b>Install Abhyashify</b> खोजें (Chrome में: Cast, save and share, फिर Install page as app)।</li><li><b>Install</b> दबाएँ।</li>`);
  openSheet('Install as an app',`${inApp?`<p class="small" style="color:var(--warn)">This looks like a browser built into another app. Open the link in Chrome (or Safari on iPhone) first, since those are the ones that can install it.</p>`:''}
    <ol class="muted" style="padding-left:20px;display:grid;gap:8px">${steps}</ol>
    <p class="small muted">The browser decides when an install option shows up, so a prompt on its own is not guaranteed. If this page is already open as an app, there is nothing to install.</p>`,()=>{});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;if(GATE==='signin'||(!GATE&&tab==='today'&&sheetEl.hidden))render(false)});
window.addEventListener('appinstalled',()=>{installEv=null;toast('Abhyashify is installed');if(GATE||tab==='today')render(false)});
async function installApp(){
  if(!installEv)return;
  installEv.prompt();
  try{await installEv.userChoice}catch(e){}
  installEv=null;
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(e=>console.warn('sw',e));
}
function accountSheet(){
  const imp=`<input type="file" id="impf" accept=".json,application/json" hidden>
    ${installBtn()}
    <button class="btn lg ghost" type="button" data-act="exportjson">${ic('upload')}Export all my data (JSON)</button>
    <button class="btn lg ghost" type="button" data-act="importjson">${ic('upload')}Import a backup (JSON)</button>`;
  if(!CL){
    openSheet('Account',`<p class="muted">You are using Abhyashify on this device only. Sign in to keep your plan and progress in sync on your phone, tablet and laptop.</p>
      ${FB?`<button class="btn lg" type="button" data-act="signin">Sign in with Google</button>`:'<p class="small muted">Sign-in is not available right now.</p>'}${imp}`,()=>{});
    return;
  }
  const cs=(CL.courses.length?CL.courses:[{id:CL.cid,name:CL.name}]).map(c=>`<button type="button" class="item" data-act="course" data-c="${esc(c.id)}" style="grid-template-columns:1fr auto"><span class="t">${esc(c.name)}</span>${c.id===CL.cid?ic('check'):''}</button>`).join('');
  openSheet('Account',`<div class="stack" style="gap:2px"><span class="kick">Signed in as</span><span class="t">${esc(CL.email)}</span><span class="small muted">This device: ${esc(deviceLabel())}. ${esc(saveText())}</span></div>
    <div class="stack" style="gap:0"><span class="kick" style="margin-bottom:4px">Courses</span>${cs}</div>
    <button class="btn lg soft" type="button" data-act="newcourse">${ic('plus')}New course</button>
    ${imp}
    <button class="btn lg danger" type="button" data-act="delcourse">Delete this course and my data</button>
    <button class="btn lg ghost" type="button" data-act="signout">Sign out</button>
    <p class="small muted">Your data is stored in your account. Only you can read it. Study time from all your devices in the same course is merged, and overlapping time is counted once.</p>`,()=>{});
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheetEl.hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&armed)keepAwake()});

/* ---------- boot ---------- */
(async function boot(){
  applyTheme();trStart();applyLangToPage();
  FB=await Promise.race([window.FBReady,new Promise(r=>setTimeout(()=>r(null),10000))]);
  setInterval(tickTimer,1000);setInterval(alarmTick,5000);
  setInterval(()=>{paintHeader();if(!GATE&&tab==='today'&&sheetEl.hidden&&document.getElementById('alarm').hidden)render(false)},60000);
  if(!FB){lsSet('pl.mode','local');enterLocal();toast('Cloud sync is unavailable. Working on this device only.');return}
  FB.onAuthStateChanged(FB.auth,user=>{
    if(user)startCloud(user).catch(e=>{console.error(e);GATE='signin';render();toast('Could not load your account: '+(e&&e.code||'error'))});
    else{stopCloud();if(lsGet('pl.mode',null)==='local')enterLocal();else{GATE='signin';render()}}
  });
})();
</script>
